name: Client checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.tests.json --noEmit
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/source-check.mjs
      - run: node scripts/source-check.mjs --history
