name: ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        # Expo SDK 57's expo-modules-jsi declares swift-tools-version 6.2,
        # but the old macos-15-intel runner only has Xcode 16.4 (Swift 6.1),
        # so the build died with "package 'apple' is using Swift tools
        # version 6.2.0 but the installed version is 6.1.0" (exit 65).
        # macos-26 ships Xcode 26 (Swift 6.2+); select the newest
        # Xcode 26 present and fail fast if there is no real toolchain.
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr | head -n 1)
          test -n "$XCODE" || { echo "No Xcode 26 found"; exit 1; }
          test -d "$XCODE/Contents/Developer" || { echo "$XCODE has no toolchain"; exit 1; }
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Generate iOS project
        # Continuous Native Generation (see AGENTS.md): ios/ is generated from
        # app.config.js + config plugins, never hand-maintained and never
        # reused from an older release. The previous workflow fetched the
        # v0.3.2 Xcode project ZIP from the upstream release and built it
        # against current (0.3.3) JS; that stale native project is a
        # needless mismatch risk. Generate fresh, exactly like
        # scripts/export-ios-project.py does.
        run: |
          npx expo prebuild --platform ios --no-install
          ls ios
          # prebuild creates the .xcodeproj and Podfile; the .xcworkspace
          # is only created by `pod install` in the next step, so check
          # for the prebuild outputs here, not the workspace.
          test -d ios/DeepTutor.xcodeproj
          test -f ios/Podfile

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update
          test -d DeepTutor.xcworkspace

      - name: Resolve SwiftPM packages
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios
          xcodebuild -resolvePackageDependencies \
            -workspace DeepTutor.xcworkspace \
            -scheme DeepTutor 2>&1 | tee /tmp/spm.log | tail -n 40
      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace DeepTutor.xcworkspace \
            -scheme DeepTutor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee /tmp/build.log

      - name: Build log summary
        if: always()
        run: |
          set +e
          echo "xcodebuild: $(xcodebuild -version | tr '\n' ' ')"
          echo "xcode-select: $(xcode-select -p)"
          {
            echo "### ERRORS"
            echo '```'
            grep -n ': error: ' /tmp/build.log | head -n 12 | cut -c1-220 || true
            echo '```'
            echo "### SPM"
            echo '```'
            grep -n -B3 -A18 'Could not resolve package dependencies' /tmp/build.log | cut -c1-240 | head -n 40 || true
            echo '```'
            echo "### SPM LOG"
            echo '```'
            tail -n 25 /tmp/spm.log 2>/dev/null | cut -c1-240 || true
            echo '```'
            echo "### FAILED CMDS"
            echo '```'
            grep -A6 'The following build commands failed' /tmp/build.log | cut -c1-220 || true
            echo '```'
            echo "### TAIL40"
            echo '```'
            tail -n 40 /tmp/build.log | cut -c1-220 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/DeepTutor.app out/Payload/
          cd out
          zip -qry ../DeepTutor-unsigned.ipa Payload
          ls -lh ../DeepTutor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-unsigned-ipa
          path: DeepTutor-unsigned.ipa
          if-no-files-found: error
