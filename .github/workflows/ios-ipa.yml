name: ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch iOS project
        run: |
          curl -fsSL -o /tmp/ios-project.zip \
            https://github.com/TinyPandaGame/deeptutor-mobile/releases/download/v0.3.2/deeptutor-mobile-0.3.2-ios-project.zip
          echo "7872574bcf63390e732efce891f98eb4a8153c5649fb5fa3f788b24c9ce6fa4a  /tmp/ios-project.zip" | shasum -a 256 -c -
          unzip -q /tmp/ios-project.zip -d /tmp/iosproj
          ls /tmp/iosproj
          cp -R /tmp/iosproj/deeptutor-mobile/ios ./ios
          ls -la ./ios | head -20

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Resolve SwiftPM packages
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios
          xcodebuild -resolvePackageDependencies \
            -workspace DeepTutor.xcworkspace \
            -scheme DeepTutor 2>&1 | tee /tmp/spm.log | tail -n 40
      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace DeepTutor.xcworkspace \
            -scheme DeepTutor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee /tmp/build.log

      - name: Build log summary
        if: always()
        run: |
          set +e
          echo "xcodebuild: $(xcodebuild -version | tr '\n' ' ')"
          echo "xcode-select: $(xcode-select -p)"
          {
            echo "### ERRORS"
            echo '```'
            grep -n ': error: ' /tmp/build.log | head -n 12 | cut -c1-220 || true
            echo '```'
            echo "### SPM"
            echo '```'
            grep -n -B3 -A18 'Could not resolve package dependencies' /tmp/build.log | cut -c1-240 | head -n 40 || true
            echo '```'
            echo "### SPM LOG"
            echo '```'
            tail -n 25 /tmp/spm.log 2>/dev/null | cut -c1-240 || true
            echo '```'
            echo "### FAILED CMDS"
            echo '```'
            grep -A6 'The following build commands failed' /tmp/build.log | cut -c1-220 || true
            echo '```'
            echo "### TAIL40"
            echo '```'
            tail -n 40 /tmp/build.log | cut -c1-220 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/DeepTutor.app out/Payload/
          cd out
          zip -qry ../DeepTutor-unsigned.ipa Payload
          ls -lh ../DeepTutor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-unsigned-ipa
          path: DeepTutor-unsigned.ipa
          if-no-files-found: error
