name: ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch iOS project
        run: |
          curl -fsSL -o /tmp/ios-project.zip \
            https://github.com/TinyPandaGame/deeptutor-mobile/releases/download/v0.3.2/deeptutor-mobile-0.3.2-ios-project.zip
          echo "7872574bcf63390e732efce891f98eb4a8153c5649fb5fa3f788b24c9ce6fa4a  /tmp/ios-project.zip" | shasum -a 256 -c -
          unzip -q /tmp/ios-project.zip -d /tmp/iosproj
          ls /tmp/iosproj
          cp -R /tmp/iosproj/deeptutor-mobile/ios ./ios
          ls -la ./ios | head -20

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace DeepTutor.xcworkspace \
            -scheme DeepTutor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee /tmp/build.log

      - name: Build log summary
        if: always()
        run: |
          {
            echo "### xcodebuild errors"
            echo '```'
            grep -nE "(error:|error |FAILED|BUILD FAILED|The following build commands failed|Code ?Sign)" /tmp/build.log | tail -n 60 || true
            echo '```'
            echo "### xcodebuild tail"
            echo '```'
            tail -n 80 /tmp/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/DeepTutor.app out/Payload/
          cd out
          zip -qry ../DeepTutor-unsigned.ipa Payload
          ls -lh ../DeepTutor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-unsigned-ipa
          path: DeepTutor-unsigned.ipa
          if-no-files-found: error
